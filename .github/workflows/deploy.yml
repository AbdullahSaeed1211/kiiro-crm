name: deploy tenants

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: tenant-deployments
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_ALLOW_LIVE: '1'
      INTERNAL_SECRET_MIRCHMEDIA: ${{ secrets.INTERNAL_SECRET_MIRCHMEDIA }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # No version input: the action reads pnpm@<version> from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the release
        run: pnpm verify

      - name: Build OpenNext artifact once
        run: pnpm --filter web exec opennextjs-cloudflare build

      - name: Verify OpenNext artifact
        run: test -f apps/web/.open-next/worker.js && test -d apps/web/.open-next/assets

      # The release is verified and built either way; it is deployed from here only when the repository secrets exist.
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$INTERNAL_SECRET_MIRCHMEDIA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and INTERNAL_SECRET_MIRCHMEDIA in the production environment to deploy from tags."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tenants in deploy order
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm tenants:deploy --tag "${GITHUB_REF_NAME}" --execute
