name: deploy tenants

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: tenant-deployments
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_ALLOW_LIVE: '1'
      # Real tenant files live in a private repository (`owner/name` in the TENANTS_REPO variable), read with a
      # read-only token; see tenants/README.md. Without them the release is verified against the example tenant only.
      TENANTS_REPO: ${{ vars.TENANTS_REPO }}
      HAS_TENANTS_REPO_TOKEN: ${{ secrets.TENANTS_REPO_TOKEN != '' }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out private tenants
        if: env.TENANTS_REPO != '' && env.HAS_TENANTS_REPO_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TENANTS_REPO }}
          token: ${{ secrets.TENANTS_REPO_TOKEN }}
          path: .tenants
          fetch-depth: 1
          persist-credentials: false

      - name: Point tooling at the private tenants
        run: if [ -d .tenants ]; then echo "KIIRO_TENANTS_DIR=.tenants" >> "$GITHUB_ENV"; fi

      # No version input: the action reads pnpm@<version> from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The committed config describes the example tenant; deploys use the real tenants.
      - name: Generate Wrangler config for the deployed tenants
        if: env.KIIRO_TENANTS_DIR != ''
        run: pnpm gen:wrangler

      - name: Verify the release
        run: pnpm verify

      - name: Build OpenNext artifact once
        run: pnpm --filter web exec opennextjs-cloudflare build

      - name: Verify OpenNext artifact
        run: test -f apps/web/.open-next/worker.js && test -d apps/web/.open-next/assets

      # Each line of TENANT_INTERNAL_SECRETS is `INTERNAL_SECRET_<SLUG>=<value>`; values are masked before export.
      # Loaded only after the tests and build, so no test step ever sees a live tenant secret.
      - name: Load tenant secrets
        env:
          TENANT_INTERNAL_SECRETS: ${{ secrets.TENANT_INTERNAL_SECRETS }}
        run: |
          printf '%s\n' "$TENANT_INTERNAL_SECRETS" | while IFS='=' read -r key value; do
            case "$key" in
              INTERNAL_SECRET_*)
                echo "::add-mask::$value"
                echo "$key=$value" >> "$GITHUB_ENV"
                ;;
            esac
          done

      # The release is verified and built either way; it is deployed from here only when the tenants and secrets exist.
      # deploy-tenants itself refuses to start when any tenant's INTERNAL_SECRET_<SLUG> is missing.
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "${KIIRO_TENANTS_DIR:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TENANT_INTERNAL_SECRETS and TENANTS_REPO_TOKEN (secrets) and TENANTS_REPO (variable) in the production environment to deploy from tags."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tenants in deploy order
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm tenants:deploy --tag "${GITHUB_REF_NAME}" --execute
